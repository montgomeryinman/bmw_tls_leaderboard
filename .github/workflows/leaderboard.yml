name: Update BMW Leaderboard

on:
  schedule:
    # Every hour from 8 AM through 6 PM Central
    - cron: "0 8-18 * * *"
      timezone: "America/Chicago"

    # 7 PM Central
    - cron: "0 19 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "jsonlite", "golfastr"), repos="https://cloud.r-project.org")'

      - name: Configure Git
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"

      - name: Poll leaderboard every minute
        run: |
          for i in {1..59}; do

            echo "======================================"
            echo "Leaderboard check $i of 59"
            date
            echo "======================================"

            Rscript script_for_updates.R

            git add data/tls_leaderboard_data.rds

            if git diff --cached --quiet; then
              echo "No change."
            else
              echo "Leaderboard changed!"

              git commit -m "Update leaderboard"
              git push
            fi

            sleep 60

          done
