name: Update BMW Leaderboard

on:
  schedule:
    - cron: "0 13-23 * * *"   # kicks off hourly during tournament hours (adjust to your timezone/UTC)
  workflow_dispatch: {}        # lets you trigger it manually too

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # stay under the 360-min (6hr) hard cap
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R deps
        run: Rscript -e 'install.packages(c("dplyr","golfastr"))'

      - name: Poll every 60s until job times out
        run: |
          END=$((SECONDS + 340*60))
          while [ $SECONDS -lt $END ]; do
            Rscript script_for_updates.R
            git config user.name "montgomeryinman"
            git config user.email "montgomeryinman@gmail.com"
            git add data/tls_leaderboard_data.rds
            git diff --cached --quiet || git commit -m "update leaderboard"
            git push || true
            sleep 60
          done
