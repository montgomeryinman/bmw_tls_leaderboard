name: Update BMW Leaderboard

on:
  schedule:
    # 8 AM - 7 PM Central Daylight Time
    # = 13:00 - 00:00 UTC
    - cron: "0 13-23 * * *"
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "jsonlite", "golfastr"), repos="https://cloud.r-project.org")'

      - name: Update leaderboard
        run: |
          Rscript script_for_updates.R

      - name: Configure Git
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"

      - name: Commit and push updated leaderboard
        run: |
          git add data/tls_leaderboard_data.rds

          if git diff --cached --quiet; then
            echo "No leaderboard changes."
          else
            git commit -m "Update leaderboard"
            git push
          fi
